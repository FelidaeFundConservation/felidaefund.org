<!-- Shopping cart notice: checkout fails silently, so tell people before
     they give up. Custom HTML module, position after-content, assigned
     ONLY to the Store menu item (cart and checkout run under it too).

     Joomla renders the module well below the cart, as a narrow column in
     a flex row. The script moves it into the cart's own left column,
     directly under the Continue Shopping / Update Cart buttons, where
     there is room and where someone is looking when checkout fails.

     If that row is not on the page, or eShop's markup ever changes, the
     script does nothing and the notice stays where Joomla put it. It
     cannot break the page either way. -->
<div class="store-notice" style="background: var(--gold-100, #f8f0d6); color: var(--espresso-900, #1f1204); border-radius: var(--r-sm, 6px); padding: 24px 28px; margin: 32px 0 0; max-width: 620px; text-align: left;">
  <p style="margin: 0 0 8px; font-family: var(--font-display, Raleway, sans-serif); font-weight: 700; font-size: 18px; line-height: 1.3;">
    Having trouble checking out?
  </p>
  <p style="margin: 0 0 18px; font-family: var(--font-body, Literata, Georgia, serif); font-size: 16px; line-height: 1.6;">
    We know about a problem with our checkout and we're working on it. Email us the items you'd like, with sizes, and we'll place the order for you.
  </p>
  <a href="mailto:info@felidaefund.org?subject=Store%20order%20%E2%80%94%20checkout%20not%20working&amp;body=Hi%2C%20I%27d%20like%20to%20order%20the%20following%20items%3A%0A%0A-%20Item%20and%20size%3A%0A-%20Item%20and%20size%3A%0A%0AThank%20you."
     style="display: inline-block; background: var(--brown-700, #814e12); color: var(--cream-100, #fffbf0); text-decoration: none; font-family: var(--font-display, Raleway, sans-serif); font-weight: 600; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; padding: 14px 24px; border-radius: var(--r-sm, 6px);">
    Email us your order
  </a>
</div>
<script>
(function () {
  var notice = document.querySelector('.store-notice');
  var row = document.querySelector('.button-row');
  if (notice && row && row.parentNode) {
    row.parentNode.insertBefore(notice, row.nextSibling);
  }
})();
</script>
