<!-- Shopping cart notice: checkout fails silently, so tell people before
     they give up. Custom HTML module, position after-content, assigned
     ONLY to the Store menu item (the cart and checkout run under it too).

     The module can only render where Joomla puts it, which is below the
     cart. The script moves it up beside the Store Checkout button, where
     people actually are when it fails. If the button is not on the page,
     or the markup ever changes, the script does nothing and the notice
     simply stays where Joomla put it. Nothing breaks either way. -->
<div class="store-notice" style="background: var(--gold-100, #f8f0d6); color: var(--espresso-900, #1f1204); border-radius: var(--r-sm, 6px); padding: 18px 20px; margin: 0 0 18px; text-align: left;">
  <p style="margin: 0 0 6px; font-family: var(--font-display, Raleway, sans-serif); font-weight: 700; font-size: 16px; line-height: 1.3;">
    Having trouble checking out?
  </p>
  <p style="margin: 0 0 12px; font-family: var(--font-body, Literata, Georgia, serif); font-size: 15px; line-height: 1.55;">
    We know about a problem with our checkout and we're working on it. Email us the items you'd like, with sizes, and we'll place the order for you.
  </p>
  <a href="mailto:info@felidaefund.org?subject=Store%20order%20%E2%80%94%20checkout%20not%20working&amp;body=Hi%2C%20I%27d%20like%20to%20order%20the%20following%20items%3A%0A%0A-%20Item%20and%20size%3A%0A-%20Item%20and%20size%3A%0A%0AThank%20you."
     style="display: inline-block; background: var(--brown-700, #814e12); color: var(--cream-100, #fffbf0); text-decoration: none; font-family: var(--font-display, Raleway, sans-serif); font-weight: 600; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; padding: 12px 18px; border-radius: var(--r-sm, 6px);">
    Email us your order
  </a>
</div>
<script>
(function () {
  var notice = document.querySelector('.store-notice');
  var button = document.querySelector('a[href$="/store/checkout"]');
  if (notice && button && button.parentNode) {
    button.parentNode.insertBefore(notice, button);
  }
})();
</script>
